[package]
name = "oneclaw-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RuntimeProvider trait and implementations for 1Claw agent cloud runtimes"
repository = "https://github.com/1clawAI/1claw-runtime"
keywords = ["ai", "agents", "runtime", "containers", "kubernetes"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Provider-specific (optional features)
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.23", features = ["latest"], optional = true }
bollard = { version = "0.18", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
default = ["docker"]
gke = ["kube", "k8s-openapi", "reqwest"]
cloudrun = ["reqwest"]
docker = ["bollard"]
all-providers = ["gke", "cloudrun", "docker"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
